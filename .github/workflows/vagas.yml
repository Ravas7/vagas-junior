name: Buscar vagas

on:
  schedule:
    # Horários em UTC. 11:00 UTC = 08:00 em Brasília; 21:00 UTC = 18:00.
    - cron: "0 11,21 * * *"
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write             # para salvar docs/data/jobs.json no repositório

concurrency:
  group: vagas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar vagas e enviar e-mail
        run: python -m vagas run
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Salvar vagas no repositório
        run: |
          git config user.name "vagas-bot"
          git config user.email "vagas-bot@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --staged --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "chore: atualiza vagas"
            git push
          fi
