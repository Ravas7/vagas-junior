# Configuração do Ragas (central de vagas).
# Segredos (senha de e-mail, chaves de API) NÃO ficam aqui: use variáveis de
# ambiente / Secrets do GitHub (veja o README).

timezone = "America/Sao_Paulo"

[storage]
path = "docs/data/jobs.json"      # o painel lê este mesmo arquivo

[email]
enabled = true
max_per_email = 40                # vagas por e-mail; o restante aparece só no painel
max_news_per_email = 10           # notícias de processo seletivo por e-mail
min_score = 40                    # suba (ex.: 60) para receber só as melhores
send_when_empty = false           # true = avisa até quando não há vagas novas
subject_prefix = "Ragas"
# dashboard_url = "https://SEU_USUARIO.github.io/vagas-junior/"   # no GitHub Actions é montado sozinho

[avisos]
# Avisos por pessoa (cada um escolhe em "Meu perfil"). O token do bot fica no Secret TELEGRAM_BOT_TOKEN.
telegram_bot = "RagasVagasBot"               # nome do bot do Telegram, sem @ (vazio = opção Telegram aparece "em breve")
hora_resumo = 15                  # a partir desta hora a coleta conta como "da noite" (manda o resumo diário)

[filter]
min_score = 40
max_years = 2                     # pedir mais que isso (sem "júnior" no título) descarta
levels = ["junior"]               # níveis que você quer: "estagio", "junior", "pleno", "senior"
include_estagio = false           # true = estágio também entra (o mesmo que pôr "estagio" em levels)
# Só vagas remotas (do Brasil) ou em Salvador e região metropolitana.
location_filter = true
state = "BA"                      # seu estado: notícias de vagas de outros estados ficam de fora
allow_remote = true
remote_abroad = true              # remoto de empresa/país de fora também entra
# Nível máximo de inglês exigido: "basico", "intermediario" (B1/B2) ou "qualquer".
# Vaga que pede inglês avançado/fluente/C1/C2 é descartada; sem informação, entra.
max_english = "intermediario"
allowed_cities = [
  "Salvador", "Lauro de Freitas", "Camaçari", "Simões Filho", "Candeias", "Dias d'Ávila",
  "São Francisco do Conde", "Madre de Deus", "Mata de São João", "Vera Cruz", "Itaparica",
  "Pojuca", "São Sebastião do Passé", "SSA",
]
unknown_location = "descartar"    # "incluir" = mantém vagas presenciais sem local informado
preferred_states = []             # opcional, ex.: ["BA"]: +10 de nota
remote_bonus = 10
max_age_days = 45                 # vaga publicada há mais tempo que isso é descartada (0 = sem limite)
keep_days = 45                    # vaga não vista há tanto tempo sai do arquivo
keep_days_news = 30               # notícias saem mais cedo
keep_days_freela = 7              # freela fecha rápido: sai do arquivo depois de 7 dias sem aparecer
freela_bloquear = []              # termos extras para descartar freela (além dos de filters.FREELA_BLOCK)
news_min_score = 40
big_bonus = 10                    # +10 de nota para empresas grandes e multinacionais
related_enabled = true            # inclui dados, QA, DevOps, segurança... (exige o nível no título)
hardware_enabled = false          # true = hardware e assistência técnica (manutenção, técnico de informática...)
exclude_companies = []
exclude_title_terms = []          # ex.: ["suporte", "sap"]
dev_terms_extra = []              # ex.: ["abap"]
related_terms_extra = []
# Suporte técnico é uma área como as outras (cada pessoa marca no perfil se quer ver).
support_enabled = true
# Salário mínimo para QUALQUER vaga que informa salário (0 = sem mínimo).
min_salary = 0                    # em R$ por mês
unknown_salary = "incluir"        # "descartar" = com mínimo, esconde vaga sem salário informado
support_terms_extra = []
junior_terms_extra = []
big_companies_extra = []          # empresas que você quer tratar como "grande", ex.: ["Sicredi"]
news_exclude_extra = []           # palavras que descartam notícias

# ---------------------------------------------------------------- fontes

[sources.gupy]
enabled = true
# Endereço que o portal da Gupy usa hoje (os antigos portal.api.gupy.io e
# employability-portal.gupy.io saíram do ar em out/2026). Não é API documentada.
# Se falhar de novo, veja o README (passo 6) para copiar a URL certa pelo navegador.
url = "https://portal.gupy.io/api/job-search/jobs"
term_param = "jobName"
limit_param = "limit"
offset_param = "offset"
limit = 50
pages = 2
# Estados onde buscar vagas presenciais e híbridas (sigla). As remotas vêm do Brasil todo.
# Amigo de outro estado entrou? Acrescente a sigla dele aqui (cada estado = mais ~50 chamadas).
states = ["BA"]
remote = true
terms = [
  "desenvolvedor junior",
  "desenvolvedor jr",
  "programador junior",
  "engenheiro de software junior",
  "analista de sistemas junior",
  "desenvolvedor python",
  "desenvolvedor java",
  "desenvolvedor front-end",
  "desenvolvedor back-end",
  # áreas correlatas e programas de grandes empresas
  "trainee tecnologia",
  "jovem talento tecnologia",
  "analista de dados junior",
  "engenheiro de dados junior",
  "qa junior",
  "devops junior",
  "seguranca da informacao junior",
  # outros níveis e áreas (cada pessoa escolhe no perfil o que quer ver).
  # A Gupy busca a frase exata: "estagio desenvolvimento" não acha nada, "estágio" acha tudo
  # (o filtro descarta estágio que não é de TI). Teste novos termos com check --source gupy.
  "estágio",
  "estagiário",
  "desenvolvedor pleno",
  "desenvolvedor senior",
  "analista de dados",
  "analista de suporte",
  "suporte técnico",
  "técnico de suporte",
  "técnico de ti",
  "assistência técnica",
  "infraestrutura",
]

[sources.adzuna]
enabled = true                    # só roda se ADZUNA_APP_ID e ADZUNA_APP_KEY existirem
country = "br"
max_days_old = 14
pages = 2
terms = ["desenvolvedor junior", "programador junior", "desenvolvedor jr", "analista de dados junior", "qa junior", "devops junior", "trainee tecnologia",
         "estagio desenvolvimento", "desenvolvedor pleno", "tecnico de informatica"]
wheres = ["Salvador", ""]         # "Salvador" (raio abaixo) e "" = país todo, só remoto
                                  # outro estado: acrescente uma cidade dele (a Adzuna busca por raio)
distance_km = 50                  # raio em volta de Salvador (pega Lauro de Freitas, Camaçari...)

[sources.greenhouse]
enabled = true
# Slug = final do endereço boards.greenhouse.io/<slug>
companies = []
location_keywords = ["brasil", "brazil", "remote", "remoto", "latam"]

[sources.lever]
enabled = true
# Slug = final do endereço jobs.lever.co/<slug>
companies = []
location_keywords = ["brasil", "brazil", "remote", "remoto", "latam"]

# --- empresas grandes e multinacionais --------------------------------------

[sources.smartrecruiters]
enabled = true
# Identificador = final do endereço jobs.smartrecruiters.com/<Identificador>
# (diferencia maiúsculas de minúsculas). country = "br" traz só vagas no Brasil.
companies = ["BoschGroup", "Visa"]
country = "br"

[sources.workday]
enabled = true
# Endereço do site de carreiras (termina no nome do site, sem /job/...).
# Busca "junior", "trainee" etc. no servidor e só guarda vagas com Brasil ou remoto.
sites = [
  "https://accenture.wd103.myworkdayjobs.com/AccentureCareers",
  "https://salesforce.wd12.myworkdayjobs.com/External_Career_Site",
  "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite",
  "https://adobe.wd5.myworkdayjobs.com/external_experienced",
]
terms = ["junior", "trainee", "desenvolvedor", "entry level", "intern", "estagio"]
location_keywords = ["brazil", "brasil", "remote", "remoto"]
keep_multi_location = false       # vagas "2 Locations" são descartadas (podem não ser no Brasil)
pages = 2

[sources.ashby]
enabled = true
# Nome do quadro = final do endereço jobs.ashbyhq.com/<nome>
companies = []
location_keywords = ["brasil", "brazil", "remote", "remoto", "latam"]

# --- notícias de processos seletivos -------------------------------------------

[sources.noticias]
enabled = true
when = "21d"                      # janela de busca no Google Notícias
max_age_days = 30
company_queries = true            # também busca por nome das grandes empresas
group_size = 8                    # empresas por busca
# queries = [...]                 # descomente para trocar as buscas padrão

# ---------------------------------------------------------------- freelas (ideia 8)
# Projetos freelancer de TI. Ficam no jobs.json com tipo "freela", saem em
# keep_days_freela dias ([filter]) e ainda não aparecem no painel (etapa 2).
# Os dois sites não têm API oficial: poucas páginas por coleta, com pausa entre elas.
[sources.workana]
enabled = true
category = "it-programming"
language = "pt"
pages = 3                         # ~9 projetos por página
delay = 1.5

[sources.freelas99]
enabled = true
categorias = ["web-mobile-e-software"]
pages = 2                         # ~10 projetos por página
delay = 1.5
